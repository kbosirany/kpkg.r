# Template kpkg.r 0.2.0.9000: github/R-CMD-check.yaml
# Adapted from https://github.com/r-lib/actions/tree/v2/examples
#
# Ubuntu with R release runs in the image of the Dockerfile (job
# `R-CMD-check-docker`, same environment as the dev container and GitLab CI);
# the other systems and versions of R are set up by r-lib/actions.
on:
  push:
    branches: [main, dev]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  ci-image:
    uses: ./.github/workflows/ci-image.yaml
    permissions:
      contents: read
      packages: write

  R-CMD-check-docker:
    needs: ci-image
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, Docker)
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Install the dependencies
        run: Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
