# Template kpkg.r 0.2.0.9000: github/ci-image.yaml
# Image of the Linux jobs, built from the Dockerfile at the root of the
# package (the dev container uses the same file) and pushed to the GitHub
# container registry (ghcr.io/<owner>/<repo>/ci). Its tag is the hash of the
# Dockerfile, so it is only built when the Dockerfile changes. Called by the
# other workflows, which run their Linux jobs in the image (output `image`).
#
# The image follows R release at the time it is built: edit the Dockerfile
# (e.g. a comment with the date) to rebuild it with the new versions of R and
# of the tools.
on:
  workflow_call:
    outputs:
      image:
        description: Name of the image, with its tag.
        value: ${{ jobs.ci-image.outputs.image }}

name: ci-image

# No workflow-level permissions: a called workflow cannot request more than
# the calling job grants (contents: read, packages: write)

jobs:
  ci-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Name of the image
        id: name
        run: |
          # ghcr.io only accepts lower-case names
          repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          hash=$(sha256sum Dockerfile | cut -c 1-12)
          echo "image=ghcr.io/$repo/ci:$hash" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image if it does not exist
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE already exists"
          else
            # without build context: the Dockerfile copies no file
            docker build -t "$IMAGE" - < Dockerfile
            docker push "$IMAGE"
          fi
