# GitLab CI equivalent of the GitHub workflows R-CMD-check.yaml and
# pkgdown.yaml.
#
# - ci-image: image of the jobs, built from the Dockerfile at the root of the
#   package (the dev container uses the same file, so the jobs can be run
#   locally).
# - check: R CMD check with the released version of R on every branch and
#   tag, and `check-devel` with the development version on dev and main.
# - coverage: test coverage with covr (coverage badge of the README).
# - pages: pkgdown site with GitLab Pages. GitLab Pages only keeps the last
#   deployment, so the job builds both branches every time: main at the root
#   of the site and dev in /dev (same layout as on GitHub Pages).

stages:
  - image
  - check
  - deploy

# Images of the jobs in the container registry of the project:
# `ci:r-latest` (R release) and `ci:r-devel`. They are built when the
# Dockerfile changes, and on scheduled or manual ("Run pipeline") pipelines,
# to follow the new versions of R and of the tools. Docker-in-Docker needs a
# runner with the Docker executor in privileged mode.
ci-image:
  stage: image
  image: docker:28
  services:
    - docker:28-dind
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/ci:r-$R_VERSION
    DOCKER_TLS_CERTDIR: "/certs"
  parallel:
    matrix:
      - R_VERSION: ["latest", "devel"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - changes:
        - Dockerfile
  script:
    - echo "$CI_REGISTRY_PASSWORD" |
        docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # without build context: the Dockerfile copies no file. R_VERSION comes
    # from the environment (parallel matrix)
    - docker build --build-arg R_VERSION -t "$IMAGE" - < Dockerfile
    - docker push "$IMAGE"

.r-latest:
  image: $CI_REGISTRY_IMAGE/ci:r-latest

.check:
  stage: check
  script:
    - Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'
    - Rscript -e 'pak::pkg_install("rcmdcheck")'
    - |
      Rscript -e 'rcmdcheck::rcmdcheck(
        args = c("--no-manual", "--as-cran"),
        build_args = "--no-manual",
        error_on = "warning",
        check_dir = "check"
      )'
  artifacts:
    when: always
    paths:
      - check
    expire_in: 1 week

check:
  extends:
    - .r-latest
    - .check

# R-devel has no binaries on CRAN (the packages are built from the sources, so
# the job is slow): it only runs on the dev and main branches, and it does not
# block the pipeline.
check-devel:
  extends: .check
  image: $CI_REGISTRY_IMAGE/ci:r-devel
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"

# Test coverage with covr. GitLab reads the percentage in the log (`coverage`
# regex) for the badge of the README, and the cobertura report for the
# coverage of the merge requests.
coverage:
  extends: .r-latest
  stage: check
  script:
    - Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'
    - |
      Rscript -e '
        cov <- covr::package_coverage()
        print(cov)
        covr::to_cobertura(cov, filename = "cobertura.xml")'
  coverage: '/Coverage: \d+(?:\.\d+)?%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

pages:
  extends: .r-latest
  stage: deploy
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
  script:
    - git fetch --quiet origin main
    - git fetch --quiet origin dev || echo "No dev branch"
    - |
      # $1: branch, $2: pkgdown mode ("release" or "devel")
      build_branch() {
        git worktree add --force "/tmp/src-$1" "origin/$1"
        cd "/tmp/src-$1"
        Rscript -e 'pak::local_install_dev_deps()'
        # the reports may use the package of the branch
        R CMD INSTALL .
        # builds the site and renders the reports in it (dev/build_site.R of
        # the pipeline, so that it also builds a branch that has no script)
        PKGDOWN_DEV_MODE="$2" KPKG_DEST="/tmp/site-$1" \
          Rscript "$CI_PROJECT_DIR/dev/build_site.R"
        cd "$CI_PROJECT_DIR"
      }
      build_branch main release
      cp -r /tmp/site-main public
      if git rev-parse --verify --quiet origin/dev > /dev/null; then
        build_branch dev devel
        # In devel mode, pkgdown writes the site in <destination>/dev
        cp -r /tmp/site-dev/dev public/dev
      fi
  artifacts:
    paths:
      - public
