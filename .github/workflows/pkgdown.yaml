# Template kpkg.r 0.1.0: github/pkgdown.yaml
# Adapted from https://github.com/r-lib/actions/tree/v2/examples
#
# The site of the main branch is published at the root of GitHub Pages and
# the site of the dev branch in /dev. Both live on the gh-pages branch:
# deployments use `clean: false` so that one never deletes the other.
#
# The site is built in the image of the Dockerfile (same environment as the
# dev container and GitLab CI), then deployed by a job on the runner.
on:
  push:
    branches: [main, dev]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  ci-image:
    uses: ./.github/workflows/ci-image.yaml
    permissions:
      contents: read
      packages: write

  pkgdown:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # "devel" builds into docs/dev/, "release" into docs/
      PKGDOWN_DEV_MODE: ${{ github.ref_name == 'dev' && 'devel' || 'release' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the package and its dependencies
        run: |
          Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'
          R CMD INSTALL .

      - name: Build site
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install = FALSE
          )
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: docs
          include-hidden-files: true

  deploy:
    needs: pkgdown
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Only one deployment at a time, so main and dev never race on gh-pages
    concurrency:
      group: pkgdown-deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: site
          path: docs

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
