# Adapted from https://github.com/r-lib/actions/tree/v2/examples
#
# Test coverage with covr, uploaded to Codecov (badge of the README). Needs
# the secret CODECOV_TOKEN, see https://app.codecov.io.
#
# The coverage is computed in the image of the Dockerfile (same environment
# as the dev container and GitLab CI), then uploaded by a job on the runner.
on:
  push:
    branches: [main, dev]
  pull_request:

name: test-coverage

permissions: read-all

jobs:
  ci-image:
    uses: ./.github/workflows/ci-image.yaml
    permissions:
      contents: read
      packages: write

  test-coverage:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Install the dependencies
        run: Rscript -e 'pak::local_install_dev_deps(dependencies = TRUE)'

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE)
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cobertura.xml

  codecov:
    needs: test-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: coverage

      - uses: codecov/codecov-action@v5
        with:
          # Fail the job only when the upload is expected to work
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
